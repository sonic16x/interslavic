name: Update dictionary
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
jobs:
  update-dictionary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # an issue when Slovosbor's votes could not be fetched
    steps:
      - name: Checkout latest tag in master
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: echo "TAG=$(git describe --tags `git rev-list --tags --max-count=1`)" >> $GITHUB_ENV
        shell: bash

      - name: Checkout latest tag
        run: git checkout $TAG
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: NPM install
        run: npm ci

      - name: Generate dictionary and detect changes
        id: check_data
        run: |
          OUTPUT=$(npm run generate-dictionary -- detect-changes)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "VOTES_STALE"; then
            echo "VOTES_STALE=true" >> $GITHUB_ENV
          fi
          if echo "$OUTPUT" | grep -q "DATA_NO_CHANGED"; then
            echo "Data has not changed. Stopping workflow."
            echo "NO_CHANGES=true" >> $GITHUB_ENV
            exit 0
          fi
        shell: bash

      # one open issue for the outage, assigned to the votes' maintainer; later nights add a comment to it
      - name: Report stale Slovosbor votes
        if: env.VOTES_STALE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: ${{ vars.VOTES_MAINTAINER || 'noomorph' }}
        run: |
          TITLE="Slovosbor votes export unavailable"
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY="The nightly dictionary build could not download Slovosbor's votes and kept the deployed ones. Run: $RUN"
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Still unavailable. Run: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee "$ASSIGNEE"
          fi
        shell: bash

      - name: Build
        if: env.NO_CHANGES != 'true'
        run: |
          npm run build
          npm run build-sw
          npm run build-sitemap
          npm run build-manifest
          npm run build-cache-list

      - name: Publish to Cloudflare Pages
        if: env.NO_CHANGES != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_AUTH_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CF_PROJECT_NAME }} --branch=main

      - name: Purge cache on Cloudflare
        if: env.NO_CHANGES != 'true'
        uses: jakejarvis/cloudflare-purge-action@v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CF_AUTH_TOKEN }}
          PURGE_URLS: '["https://interslavic-dictionary.com/data/*"]'
